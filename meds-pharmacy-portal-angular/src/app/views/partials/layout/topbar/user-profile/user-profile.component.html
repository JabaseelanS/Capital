    <div ngbDropdownToggle class="kt-header__topbar-wrapper">

        <div class="kt-header__topbar-user" [ngClass]="{'kt-header__topbar-icon': icon}">
            <!-- <span class="kt-header__topbar-welcome kt-hidden-mobile" *ngIf="greeting">Hi,</span> -->
            <a target="_blank"><img style="margin-right: 8px;"
                    src="../../../../../../assets/orderv2/packapill_portal_icons/Elements/profile_Red.svg"></a>
            <span class="kt-header__topbar-username kt-hidden-mobile l-c rob-b _12px"
                *ngIf="greeting">{{user?.UserName}}</span>
            <i *ngIf="icon" class="flaticon2-user-outline-symbol"></i>
            <img *ngIf="avatar" alt="Pic"
                src='../../../../../../assets/orderv2/packapill_portal_icons/Elements/Frame 3.svg'>
            <span *ngIf="badge"
                class="kt-badge kt-badge--username kt-badge--unified-success kt-badge--lg kt-badge--rounded kt-badge--bold">{{user?.username|firstLetter}}</span>
        </div>
    </div>
    <div ngbDropdownMenu
        class="dropdown-menu dropdown-menu-fit dropdown-menu-right dropdown-menu-anim dropdown-menu-top-unround dropdown-menu-xl">
        <!--begin: Head -->
        <div class="kt-user-card kt-user-card--skin-dark kt-notification-item-padding-x" style="background: #F8F8F8;">
            <div class="kt-user-card__avatar">
                <!-- [attr.src]="user$.pic" -->
                <!-- <img alt="Pic" [src]="user?.PharmacyLogo"
                    onerror="this.src='../../../../../../assets/packapill-icons/user/girl-2.png'" /> -->
                <img alt="Pic" src="../../../../../../assets/packapill-icons/user/girl-2.png" />
                <span [hidden]="true" class="kt-badge kt-badge--lg kt-badge--rounded kt-badge--bold kt-font-success">
                    {{user?.UserName|firstLetter}}
                </span>
            </div>
            <div class="row">
                <div style="font-size: small;" class="row l-c rob-b _12px mt-10 kt-user-card__name">
                    {{user?.UserName}}
                </div>
                <div class="row kt-user-card__name l-c rob-b _12px">
                    <a mat-raised-button href="javascript:;" (click)="logout()"
                        class="light-button rob _12px fw-600 signout-hover">Sign
                        Out</a>
                </div>
            </div>
        </div>
