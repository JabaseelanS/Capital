<div class="top" style="background-color:#f4f4f4 ;">
    <div class="row">
        <div class="col-md-12">
            <div class="card-body">
                <div fxLayout="row" fxLayout.xs="column">
                    <div class="col-md-8">
                        <mat-form-field class="Mat-Box" appearance="legacy">
                            <mat-label>Search</mat-label>
                            <input matInput (keyup)="applyFilter($event.target.value, true)">
                        </mat-form-field>
                    </div>
                    <div class="col-md-4">
                        <button (click)="editUser(null)" mat-raised-button matTooltip="Create new pharmacy"
                            color="primary" class="bck-clr" type="button">
                            <img style="margin-right:5px;"
                                src="../../../../../assets/packapill-icons/add-16.png"><span>Add Delivery User</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="tp-body">
        <div style="background-color: #f4f4f4;border-radius: 12px 12px;">

            <perfect-scrollbar class="scrl-cls">
                <mat-table class="lmat-elevation-z8 table" #table [dataSource]="dataSource" matSort>

                    <ng-container matColumnDef="FirstName">
                        <mat-header-cell class="header-text" *matHeaderCellDef mat-sort-header>Name</mat-header-cell>
                        <mat-cell *matCellDef="let user">{{user.FirstName}} {{user.LastName}}</mat-cell>
                    </ng-container>

                    <ng-container matColumnDef="UserName">
                        <mat-header-cell class="header-text" *matHeaderCellDef mat-sort-header>User Name
                        </mat-header-cell>
                        <mat-cell *matCellDef="let user">{{user.UserName}}</mat-cell>
                    </ng-container>

                    <ng-container matColumnDef="UserDob">
                        <mat-header-cell class="header-text" *matHeaderCellDef mat-sort-header fxHide.xs fxHide.sm>DOB
                        </mat-header-cell>
                        <mat-cell *matCellDef="let user" fxHide.xs fxHide.sm>{{user.UserDob | date : 'dd/MM/yyyy'}}
                        </mat-cell>
                    </ng-container>

                    <ng-container matColumnDef="UserEmail">
                        <mat-header-cell *matHeaderCellDef mat-sort-header class="email-cell header-text" fxHide.xs
                            fxHide.sm>
                            Email
                        </mat-header-cell>
                        <mat-cell matTooltip="{{user.UserEmail}}" *matCellDef="let user" fxHide.xs fxHide.sm>
                            <p class="text">{{user.UserEmail}}</p>
                        </mat-cell>
                    </ng-container>

                    <ng-container matColumnDef="Mobileno">
                        <mat-header-cell *matHeaderCellDef mat-sort-header class="email-cell header-text" fxHide.xs
                            fxHide.sm>
                            Phone
                        </mat-header-cell>
                        <mat-cell matTooltip="{{user.Mobileno}}" *matCellDef="let user" class="text-truncate" fxHide.xs
                            fxHide.sm>
                            {{user.Mobileno}}
                        </mat-cell>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <mat-header-cell class="header-text" *matHeaderCellDef>Actions</mat-header-cell>
                        <mat-cell *matCellDef="let user">
                            <button (click)="editUser(user)" mat-icon-button color="primary" matTooltip="Edit user">
                                <img style="height: 14px;" src="../../../../../assets/packapill-icons/EditRed.svg">
                            </button>&nbsp;
                            <button mat-icon-button color="warn" matTooltip="Delete user" type="button"
                                (click)="deleteUser(user)">
                                <img style="height: 14px;" src="../../../../../assets/packapill-icons/delete.png">
                            </button>
                        </mat-cell>
                    </ng-container>
                    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>

                    <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
                </mat-table>
            </perfect-scrollbar>
            <div class="no-results" *ngIf="dataSource == null || dataSource.data.length === 0">No records found
            </div>
            <!-- Message for empty data  -->
        </div>

        <!-- start: BOTTOM -->
        <div class="mat-table__bottom">
            <!-- MATERIAL SPINNER | Url: 'https://material.angular.io/components/progress-spinner/overview' -->
            <!-- <mat-spinner [diameter]="20" *ngIf="isLoading"></mat-spinner> -->
            <!-- MATERIAL PAGINATOR | Binded to dasources -->
            <!-- See off.documentations 'https://material.angular.io/components/paginator/overview' -->
            <mat-paginator [pageSize]="10" [pageSizeOptions]="[10, 15, 20, 50, 100, 150, 200]" [length]="totalLength"
                [showFirstLastButtons]="true"></mat-paginator>
        </div>
        <!-- end: BOTTOM -->
        <!-- </div> -->
        <!-- end::Body -->
    </div>
</div>
