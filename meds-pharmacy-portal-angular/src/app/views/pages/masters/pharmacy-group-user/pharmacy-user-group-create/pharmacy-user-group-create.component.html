<div *ngIf="edited" class="top" style="background-color: #f4f4f4;">

    <div class="dialog-header" fxLayout="row" fxLayoutAlign="space-between">
        <div fxLayout="row" fxLayoutAlign="start">
            <h3>
                <p class="header-text">{{modalData.user ? 'Edit' : 'Create'}} Pharmacy Admin</p>
            </h3>
        </div>
        <div>
            <button *ngIf="this.loginDetails.RoleId !=null && this.loginDetails.RoleId!=5" class="mr-4"
                [disabled]="!userForm.valid || !userForm.dirty" (click)="onSave()" mat-raised-button><img
                    style="margin-right: 5px;"
                    src="../../../../../assets\orderv2\packapill_portal_icons\Elements\Petrol.svg">{{modalData.user ?
                'Update' :
                'Save'}}</button>
            <!-- <button class="mr-4" (click)="onSave()" mat-raised-button>{{modalData ? 'Update' : 'Save'}}</button> -->
            <button mat-raised-button (click)="closeDialog()" [mat-dialog-close]><img style="margin-right: 5px;"
                    src="../../../../../assets/packapill-icons/multiply-16.png">Close</button>
        </div>
    </div>

    <div>
        <!--Login Details -->
        <perfect-scrollbar style="max-width: 100%; max-height: 500px;">
            <div class="phrmusr-body">
                <form name="userForm" [formGroup]="userForm" fxLayout="column" fxLayout.xs="column" fxLayout.sm="column"
                    fxLayout.md="column">
                    <div class="sec-div" fxLayout="row" fxLayoutAlign="start">
                        <h3>
                            <p class="htxt">Login Information</p>
                        </h3>
                    </div>
                    <div fxLayout="row" fxLayout.sm="column" fxLayout.md="column" style="margin-left: 60px;">


                        <div class="mr-4 cls-top">
                            <p>User Name <small style="color: red;">*</small></p>
                            <mat-form-field *ngIf="userModel.UserId == null || userModel.UserId ==0"
                                class="pharmtxt-area" appearance="outline">
                                <input (keydown.space)="$event.preventDefault();" autocomplete="nope" autocorrect="off"
                                    (focus)="commonServices.setAutoFillOff($event)" autocapitalize="off" matInput
                                    formControlName="UserName" required>
                            </mat-form-field>
                            <span class="disable-username" *ngIf="userModel.UserId != null && userModel.UserId >0"
                                appearance="outline">
                                <p class="m-username">{{userForm.controls['UserName'].value}}</p>
                            </span>
                        </div>

                        <div *ngIf="this.modalData.user==null" class="mr-4 cls-top">
                            <p> Password <small style="color: red;">*</small></p>
                            <mat-form-field class="pharmtxt-area" appearance="outline">
                                <input (keydown.space)="$event.preventDefault();" matInput
                                    formControlName="UserPassword" placeholder="Enter your password"
                                    (focus)="commonServices.setAutoFillOff($event)" [type]="hide ? 'password' : 'text'"
                                    required autocomplete="new-password">
                                <button mat-icon-button matSuffix>
                                    <mat-icon (click)="hide = !hide">{{hide ? 'visibility_off' : 'visibility'}}
                                    </mat-icon>
                                </button>
                            </mat-form-field>
                        </div>

                        <div class="mr-4 cls-top">
                            <p>Email<small style="color: red;">*</small></p>
                            <mat-form-field class="pharmtxt-area" appearance="outline">
                                <input type="email" (keydown.space)="$event.preventDefault();" matInput
                                    formControlName="UserEmail" required>
                            </mat-form-field>
                        </div>

                        <!-- <div class="mr-4 cls-top" style="margin-top: 25px;">

                            <mat-checkbox class="example-margin" formControlName="IsUserType">
                                <p>Is Pharmacy Group Admin</p>
                            </mat-checkbox>
                        </div> -->

                    </div>
                    <div fxLayout="row" fxLayout.sm="column" fxLayout.md="column" style="margin-left: 60px;">
                        <div class="mr-4 cls-top">
                            <p>First Name</p>
                            <mat-form-field class="pharmtxt-area" appearance="outline">
                                <input matInput formControlName="FirstName" name="FirstName">
                            </mat-form-field>
                        </div>

                        <div class="mr-4 cls-top">
                            <p>Last Name</p>
                            <mat-form-field class="pharmtxt-area" appearance="outline">
                                <input matInput formControlName="LastName" name="LastName">
                            </mat-form-field>
                        </div>
                        <div class="mr-4 cls-top">
                            <p>Mobile</p>
                            <mat-form-field class="pharmtxt-area" appearance="outline">
                                <input (keydown.space)="$event.preventDefault();"
                                    (ngModelChange)="onChangeByMob($event,true)" type="tel" [maxlength]="MobLength"
                                    [textMask]="{mask: mobMask,guide:false}" (paste)="$event.preventDefault()" matInput
                                    formControlName="Mobileno">
                            </mat-form-field>
                        </div>
                    </div>

                        </div>

                </form>
            </div>

            <div class="phrmusr-body">
                <p></p>
                <dual-list [sort]="keepSorted" [source]="source" [key]="key" [display]="display" [filter]="filter"
                    [(destination)]="confirmed" [filter]="filter" height="265px" [format]="format" [disabled]="disabled"
                    (destinationChange)="userForm.markAsDirty();"></dual-list>
            </div>

        </perfect-scrollbar>
    </div>
