<div class="parent-body">
    <!-- Headers -->
    <div fxLayout='row' class="n-s-h">
        <div class="b-line rob col-md-4 tbox ml-20">
            <mat-form-field appearance="legacy" class="w-100">
                <mat-label>Search name, email, mobile</mat-label>
                <input #searchkey class="l-c rob-b _12px" matInput (keyup)="applyFilter($event.target.value, true)">
            </mat-form-field>
        </div>
        <div *ngIf="this.userdetails.RoleId !=null && this.userdetails.RoleId!=5" class="col-md-6"
            style="text-align-last: end;">
            <button (click)="addPharmacy(null)" mat-raised-button matTooltip="Create pharmacy group"
                class="rob-sm _12px dark-petrol white" type="button">
                <img style="margin-right:5px;" src="../../../../../assets/packapill-icons/add-16.png"><span>Add
                    Pharmacy Group</span>
            </button>
        </div>
    </div>

    <div fxLayout='row'>
        <perfect-scrollbar style="max-height: calc(70vh - 0px);background-color: #fff;">
            <div class="rob" style="background-color: #fff;padding: 0px 18px;width: 100%;">
                <table class="table table-striped ">
                    <thead class="v2-h-lt rob-b _12px l-c">
                        <tr>
                            <th>Pharmacy Group Name</th>
                            <th>Date</th>
                            <th>Contact Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th style="text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="l-c">
                        <tr class="r-bor" *ngFor="let pgModel of PharmacyGrpList | slice: lowValue : highValue">

                            <td class="b-no">
                                {{pgModel.PharmacyGrpName}}
                            </td>
                            <td class="b-no">
                                {{pgModel.CreatedOn | date:"dd/MM/yyyy"}}
                            </td>
                            <td class="b-no">
                                {{pgModel.ContactName}}
                            </td>

                            <td class="b-no">
                                {{pgModel.Email}}
                            </td>
                            <td class="b-no">
                                {{commonServices.convertNum(pgModel.PhoneNo1)}}
                            </td>
                            <td class="row" style="justify-content: center;">
                                <button mat-icon-button color="primary" (click)="editPharmacy(pgModel)"
                                    matTooltip="Edit group">
                                    <img style="height: 14px;" src="../../../../../assets/packapill-icons/EditRed.svg">
                                </button>
                                <!-- <button style="height: 32px;min-width: 75px;" (click)="addPharmacy(pgModel)"
                                    mat-raised-button class="mr-4 dark-petrol white rob-b _11px" matTooltip="Edit">
                                    <img style="margin-top: -6px;height: 14px;width: 12px;margin-right: 5px;"
                                        src="../../../../../assets/packapill-icons/Edit.svg">Edit
                                </button>&nbsp; -->
                                <!-- <button style="height: 32px;min-width: 75px;" (click)="deleteUser(pgModel)"
                                    mat-raised-button class="mr-4 dark-petrol white rob-b _11px" matTooltip="Edit">
                                    <img style="margin-top: -6px;height: 14px;width: 12px;margin-right: 5px;"
                                        src="../../../../../assets/packapill-icons/delete.svg">Delete
                                </button> -->
                            </td>

                        </tr>
                    </tbody>

                </table>
                <div *ngIf="PharmacyGrpList.length == 0" class="rob-b r-c">
                    No record found
                </div>
                <mat-paginator class="pag-mat" [length]="PharmacyGrpList.length" [pageSize]=10
                    [pageSizeOptions]="[5, 10, 25, 100]" (page)="getPaginatorData($event)">page
                </mat-paginator>
            </div>
        </perfect-scrollbar>
    </div>
</div>
