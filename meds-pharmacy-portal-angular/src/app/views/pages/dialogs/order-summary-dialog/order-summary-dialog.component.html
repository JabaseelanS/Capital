<div class="top" style="background-color: #f4f4f4;">
    <div class="dialog-header sec-div2" fxLayout="row" fxLayoutAlign="space-between">
        <div fxLayout="row" fxLayoutAlign="start">
            <h3 class="headerborder">
                <p class="header-text">Order Summary</p>
            </h3>
        </div>
        <div>
            <button mat-raised-button (click)="submit()" class="mr-4"><img style="margin-right: 5px;"
                    src="../../../../../assets\orderv2\packapill_portal_icons\Elements\Petrol.svg">{{testdata!=null ?
                'Update' :
                'Save'}}</button>

            <button mat-raised-button (click)="close()" [mat-dialog-close]>
                <img style="margin-right: 5px;" src="../../../../../assets/packapill-icons/multiply-16.png">Close
            </button>
        </div>
    </div>
    <perfect-scrollbar style="max-width: 100%; max-height: 620px">
        <div class="phrm-body">
            <div novalidate fxLayout="column">
                <div fxLayout="row" fxLayout.sm="column" fxLayout.md="column" fxLayout.md="column"
                    style="margin-left: 60px;">

                    <div class="mr-4 cls-top">
                        <p class="rob-b _11px l-c">Report type<small style="color: red;">*</small></p>
                        <mat-form-field class="hit rob-b _10px l-c" appearance="outline">
                            <mat-select [(ngModel)]="ReportType" placeholder="Please choose report" required>
                                <mat-option [disabled]>--None--</mat-option>
                                <mat-option *ngFor="let report of reportlist" [value]="report.id">
                                    {{report.reportname}}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                    <div class="mr-4 cls-top">
                        <p class="rob-b _11px l-c">From and To Date<small style="color: red;">*</small></p>
                        <mat-form-field appearance="outline">
                            <input matInput placeholder="From and To Date" [min]="minDate" [max]="maxDate"
                                (dateInput)="validatedate($event.target.value)" readonly [(ngModel)]="formandtodate"
                                [satDatepicker]="picker" style="max-width: 225px;" autocomplete="nope">
                            <sat-datepicker #picker [rangeMode]="true">
                            </sat-datepicker>
                            <sat-datepicker-toggle matSuffix [for]="picker"></sat-datepicker-toggle>
                        </mat-form-field>
                    </div>
                </div>
            </div>
        </div>
    </perfect-scrollbar>
</div>
