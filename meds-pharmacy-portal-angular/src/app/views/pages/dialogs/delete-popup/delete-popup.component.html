<div style="background: #f4f4f4 !important;">
    <div class="modal-header">
        <h4 style="font-size: large !important;" class="modal-title">Cancel Delivery</h4>
        <button type="button" class="close" aria-label="Close" (click)="closeDialog('Hide')"><span
                aria-hidden="true">&times;</span>
            <!-- <button type="button" *ngIf="!WEmail" class="close" aria-label="Close" (click)="closeDialog('Hide')">
            <span aria-hidden="true">&times;</span> -->
        </button>
    </div>
    <div class="card-body" style="background-color: #f4f4f4;; border-radius: 0px 0px 12px 12px;">
        <div style="height: 45px;">
            <p style="padding: 0px 0 0 3%;font-weight: 500;color: #5a5a5a;">{{headerstr}}</p>
        </div>
        <div style="text-align: right;"><button mat-raised-button style="width: 18%;height: 35px;" type="button"
                class="light-button pop _12px fw-600" (click)="closeDialog('Hide')"><span>No</span>
            </button>
            <button style="width: 20%;height: 35px;padding: 0px;" type="button"
                class="success-button green-clr pop _12px fw-600" (click)="show('Show')">Yes</button>
        </div>
    </div>
</div>
