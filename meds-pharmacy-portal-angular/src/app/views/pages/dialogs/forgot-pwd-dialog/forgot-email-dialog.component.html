<div class="slide-top" style="background: #f8f8f8;height: 100%;">
    <div class="row" style="text-align-last: end;
    padding: 20px 0px 14px 20px;
    background-color: #f7f8fa;
    border-bottom: 1px solid #ebedf2;">
        <div style="width: 78%;    text-align-last: center;
    padding-left: 50px;">
            <span style="color:  #005760;
    font-size: 18px;
    font-family: Roboto Bold;">Email Verification
            </span>
        </div>

        <div>
            <button (click)="closeDialog()" mat-raised-button class="rob-b _11px cls-btn-fp h-w-btn01"><img
                    style="margin-right: 5px;"
                    src="../../../../../assets/packapill-icons/multiply-16.png">Close</button>
        </div>

    </div>

    <div style="padding:70px 0px 0px 100px;">
        <div>
            <form [formGroup]="emailForm" autocomplete="nope">
                <div class="form-group" style="margin-bottom: 12px;">
                    <mat-form-field class="login-tbg rob _11px l-c f_pass" appearance="legacy" style="width: 270px;">
                        <mat-label>{{ 'AUTH.INPUT.EMAIL' | translate }}</mat-label>
                        <input style="height: 22px;" matInput type="email" formControlName="email"
                            autocomplete="nope" />
                        <mat-error *ngIf="isControl01HasError('email','required')">
                            <strong>{{ 'AUTH.VALIDATION.REQUIRED_FIELD' | translate }}</strong>
                        </mat-error>
                        <mat-error *ngIf="isControl01HasError('email','pattern')">
                            <strong>{{ 'AUTH.VALIDATION.INVALID_FIELD' | translate }}</strong>
                        </mat-error>
                        <mat-error *ngIf="isControl01HasError('email','minLength')">
                            <strong>{{ 'AUTH.VALIDATION.MIN_LENGTH_FIELD' | translate }} 3</strong>
                        </mat-error>
                        <mat-error *ngIf="isControl01HasError('email','maxLength')">
                            <strong>{{ 'AUTH.VALIDATION.MAX_LENGTH_FIELD' | translate }} 320</strong>
                        </mat-error>
                    </mat-form-field>
                </div>
                <div style="padding-left: 80px;
    padding-top: 40px;">
                    <button [disabled]="!emailForm.valid" mat-raised-button
                        class="dark-petrol rob-b _11px white cls-btn-fp h-w-btn02 l-h-0"
                        (click)="emailCode(emailForm.value,$event)"><span style="margin-left: 20px;">Send Code</span>
                        <img style="margin-left: 13%;" src="../../../../../assets/packapill-icons/right-24.png">
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
